name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Check BUILD files are up to date
        run: bazel run --config=ci //:gazelle.check

      # Builds every target (the extension type-check, bundle and .vsix included) and runs the unit tests.
      # The integration suite drives a real VS Code with the 1.2 GB JetBrains.kotlin-server extension and a local
      # Elide install; it is run locally (`bazel run //packages/vscode:integration_test`), not on CI runners.
      - name: Build and test
        run: bazel test --config=ci //...

      - name: Stage extension
        run: |
          version="$(jq -r '.version' packages/vscode/package.json)"
          mkdir -p "$RUNNER_TEMP/vsix"
          cp "$(bazel cquery --config=ci --output=files //packages/vscode:vsix)" "$RUNNER_TEMP/vsix/elide-${version}.vsix"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/vsix/*.vsix
          retention-days: 7
