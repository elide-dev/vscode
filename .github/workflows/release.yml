name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # a PAT lets CI run on the release pull request; with the default token GitHub suppresses those events
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: ${{ github.event_name != 'workflow_dispatch' }}

  publish:
    name: Publish Extension
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run unit tests
        run: bazel test --config=ci //...

      # the tag and `packages/vscode/package.json` are both written by release-please, so they cannot disagree
      - name: Publish extension to Elide repository
        run: tools/deploy.sh
        env:
          BAZEL_FLAGS: --config=ci
          ELIDE_PLUGINS_KEY: ${{ secrets.ELIDE_PLUGINS_KEY }}
          ELIDE_PLUGINS_URL: ${{ vars.ELIDE_PLUGINS_URL }}

      # Marketplace publication is opt-in: the step is skipped until `VSCE_PAT` (an Azure DevOps personal access token
      # for the `elide` publisher) exists, so releases keep working before the publisher is provisioned.
      # `tools/deploy.sh` already produced the .vsix; publishing that exact file avoids a second, differing package.
      - name: Publish extension to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "::notice::VSCE_PAT is not set; skipping Marketplace publication"
            exit 0
          fi
          version="$(jq -r '.version' packages/vscode/package.json)"
          bazel run --config=ci //packages/vscode:vsce -- publish --no-dependencies --packagePath "$PWD/dist/elide-${version}.vsix"

      - name: Attach the extension to the GitHub Release
        run: gh release upload "$TAG" dist/*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
