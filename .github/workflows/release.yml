name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tools/deploy.sh` takes the version from package.json; a tag that disagrees would publish a surprise version.
      - name: Verify tag matches the manifest version
        run: |
          manifest="$(jq -r '.version' packages/vscode/package.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$manifest" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/vscode/package.json version $manifest"
            exit 1
          fi

      - name: Run unit tests
        run: bun run test

      - name: Publish extension to Elide repository
        run: tools/deploy.sh
        env:
          ELIDE_PLUGINS_KEY: ${{ secrets.ELIDE_PLUGINS_KEY }}
          ELIDE_PLUGINS_URL: ${{ vars.ELIDE_PLUGINS_URL }}

      # Marketplace publication is opt-in: the step is skipped until `VSCE_PAT` (an Azure DevOps personal access token
      # for the `elide` publisher) exists, so releases keep working before the publisher is provisioned.
      # `tools/deploy.sh` already produced the .vsix; publishing that exact file avoids a second, differing package.
      - name: Publish extension to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "::notice::VSCE_PAT is not set; skipping Marketplace publication"
            exit 0
          fi
          version="$(jq -r '.version' packages/vscode/package.json)"
          bunx @vscode/vsce publish --no-dependencies --packagePath "packages/vscode/elide-${version}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
