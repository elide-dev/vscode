version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"

  # Bun ecosystem: the repo has no package-lock.json, only the text-based `bun.lock` the bun updater understands.
  # CI runs `bun install --frozen-lockfile`, so a bump whose lockfile was not refreshed fails loudly instead of merging.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
