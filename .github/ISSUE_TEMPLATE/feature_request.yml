name: Feature request
description: Suggest an improvement or new capability for the Elide extension for VS Code.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? What's missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the extension does this relate to, if applicable?
      options:
        - project sync
        - Kotlin LSP workspace
        - tasks
        - debugging
        - packaging
        - docs
    validations:
      required: false
