name: Bug report
description: Report a problem with the Elide extension for VS Code.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open workspace '...'
        2. Run command '...'
        3. See error
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Elide extension version
      description: Found in the Extensions view, or `code --list-extensions --show-versions`.
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help > About, or `code --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. macOS 14.5 arm64, Ubuntu 22.04 x86_64, Windows 11 x86_64
    validations:
      required: true
  - type: input
    id: elide-version
    attributes:
      label: Elide CLI version
      description: Output of `elide --version`.
    validations:
      required: true
  - type: input
    id: kotlin-lsp-version
    attributes:
      label: JetBrains.kotlin-server extension version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Elide output-channel log
      description: >-
        Open the "Elide" output channel (View > Output, select "Elide" from the dropdown) and
        paste the relevant log output here.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Confirmation
      options:
        - label: I have scrubbed the log output above of any secrets or private information.
          required: true
